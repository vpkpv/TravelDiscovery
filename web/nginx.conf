server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # index.html references hashed asset filenames (Vite fingerprints every
    # build), so a cached copy of it after a deploy means the browser never
    # even requests the new JS — confirmed live: a real device kept running
    # stale code across several redeploys until this was added. No explicit
    # Cache-Control here at all meant nginx's default headers let browsers
    # cache it via their own heuristics.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # config.js is regenerated per container start (see
    # docker-entrypoint.d/40-inject-config.sh) — same staleness risk as
    # index.html, same fix.
    location = /config.js {
        add_header Cache-Control "no-cache";
    }

    # Actual build assets are safe to cache hard: Vite gives every file a
    # content hash, so a changed file always gets a new filename.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
